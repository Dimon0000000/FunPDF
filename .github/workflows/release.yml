name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Build Windows executable
        run: |
          go build -trimpath -ldflags "-s -w -X FunPDF/internal/common.version=${{ github.ref_name }}" -o FunPDF-${{ github.ref_name }}.exe .

      - name: Generate checksums
        run: sha256sum FunPDF-${{ github.ref_name }}.exe > FunPDF-${{ github.ref_name }}.exe.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FunPDF-${{ github.ref_name }}.exe
            FunPDF-${{ github.ref_name }}.exe.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
