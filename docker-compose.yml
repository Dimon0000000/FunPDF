services:
  mysql:
    image: mysql:8.4
    container_name: funpdf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: funpdf
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: funpdf
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FUNPDF_MYSQL_DSN: "root:password@tcp(mysql:3306)/funpdf?charset=utf8mb4&parseTime=True&loc=Local"
      FUNPDF_ADDR: ":9384"
    ports:
      - "9384:9384"
    volumes:
      - app_cache:/app/Cache

volumes:
  mysql_data:
  app_cache:
